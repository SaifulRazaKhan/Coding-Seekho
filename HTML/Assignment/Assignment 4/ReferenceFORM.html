<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Form</title>
</head>
<body>
    <form>
        <label for="name">Name:</label>
        <input type="text" name="" id="name">
        <br><br>

        <label for="fname">Father Name:</label>
        <input type="text" name="" id="fname">
        <br><br>
        
        <label for="mail">Email:</label>
        <input type="email" name="" id="mail">
        <br><br>

        <label for="Gender">Gender:</label><br>
        <label for="male">Male</label>
        <input type="radio" name="Gender" id="male">
        <label for="female">Female</label>
        <input type="radio" name="Gender" id="female">
        <label for="other">Others</label>
        <input type="checkbox" name="Gender" id="other">
        <br><br>

        <label for="dob">DOB:</label>
        <input type="date" name="" id="dob">
        <br><br>

        <label for="course">Courses:</label>
        <select name="course" id="course">
            <option value="CS">CS</option>
            <option value="EE">EE</option>
            <option value="ECE">ECE</option>
        </select>
        <br><br>

        <label for="address">Address</label>
        <textarea name="address" id="address"></textarea><br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file">
        <br><br>

        <label for="hobbies">Hobbies</label>
        <label for="rd">Reading</label>
        <input type="checkbox" name="Reading" id="rd">
        <label for="fb">Football</label>
        <input type="checkbox" name="Football" id="fb">
        <label for="sk">Sketching</label>
        <input type="checkbox" name="Sketching" id="sk">
        <br><br>

        <button>Submit</button>
    </form>
</body>
</html>
